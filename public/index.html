<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Salida de Vehículos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .links { text-align: center; margin-top: 15px; }
        .links a { color: #007bff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Salida</h2>
    <form id="vehicleForm">
        <div class="form-group">
            <label for="placa">Placa (Exactamente 6 caracteres):</label>
            <input type="text" id="placa" name="placa" maxlength="6" minlength="6" required placeholder="Ej: ABC123">
        </div>
        <div class="form-group">
            <label for="farm_name">Nombre de la Finca:</label>
            <input type="text" id="farm_name" name="farm_name" required placeholder="Ej: Finca El Paraíso">
        </div>
        <div class="form-group">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" required placeholder="Ej: 50">
        </div>
        <div class="form-group">
            <label for="hora_salida">Hora de Salida:</label>
            <input type="time" id="hora_salida" name="hora_salida" required>
        </div>
        <div class="form-group">
            <label for="posible_llegada">Posible Hora de Llegada:</label>
            <input type="time" id="posible_llegada" name="posible_llegada" required>
        </div>
        <button type="submit">Guardar Registro</button>
    </form>
    <div class="links">
        <p><a href="/records">Ver Historial Público</a></p>
    </div>
</div>

<script>
    document.getElementById('vehicleForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const placa = document.getElementById('placa').value.trim().toUpperCase();

        // Validar que tenga exactamente 6 caracteres
        if (placa.length !== 6) {
            alert('⚠️ La placa debe tener exactamente 6 caracteres.');
            return;
        }

        const formData = {
            placa: placa,
            farm_name: document.getElementById('farm_name').value.trim(),
            cantidad: document.getElementById('cantidad').value,
            hora_salida: document.getElementById('hora_salida').value,
            posible_llegada: document.getElementById('posible_llegada').value
        };

        try {
            const response = await fetch('/api/vehiculos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok) {
                alert('¡Vehículo registrado con éxito!');
                document.getElementById('vehicleForm').reset();
            } else {
                alert('Error: ' + (result.error || 'No se pudo guardar'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ocurrió un error de conexión.');
        }
    });
</script>

</body>
</html>
