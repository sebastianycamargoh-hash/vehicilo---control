<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Salida de Vehículos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="datetime-local"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .btn-records { display: block; text-align: center; background: #007bff; color: white; padding: 10px; text-decoration: none; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        .btn-records:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Salida</h2>
        
        <form action="/save-record" method="POST" onsubmit="prepararEnvio()">
            <div class="form-group">
                <label for="placa">Placa del Vehículo:</label>
                <input type="text" id="placa" name="placa" required placeholder="Ej: ABC123">
            </div>

            <div class="form-group">
                <label for="farm_name">Nombre de la Granja:</label>
                <input type="text" id="farm_name" name="farm_name" required placeholder="Ej: Granja San José">
            </div>

            <div class="form-group">
                <label for="cantidad_visual">Cantidad:</label>
                <!-- Este campo muestra los puntos de mil visualmente -->
                <input type="text" id="cantidad_visual" required placeholder="Ej: 10.000" oninput="formatearCantidad(this)">
                <!-- Este campo oculto envía el número limpio (sin puntos) al servidor -->
                <input type="hidden" id="cantidad" name="cantidad">
            </div>

            <div class="form-group">
                <label for="hora_salida">Hora de Salida:</label>
                <input type="datetime-local" id="hora_salida" name="hora_salida" required>
            </div>

            <div class="form-group">
                <label for="posible_llegada">Posible Hora de Llegada:</label>
                <input type="datetime-local" id="posible_llegada" name="posible_llegada" required>
            </div>

            <button type="submit" class="btn-submit">Guardar Registro</button>
        </form>

        <a href="/records" class="btn-records">👁️ Ver Historial Público</a>
    </div>

    <script>
        // Función para formatear automáticamente con puntos de mil mientras se escribe
        function formatearCantidad(input) {
            // Quitar todo lo que no sea número
            let valorLimpio = input.value.replace(/\D/g, '');
            
            // Guardar el número sin puntos en el input oculto que va al servidor
            document.getElementById('cantidad').value = valorLimpio;

            if (valorLimpio !== '') {
                // Formatear con puntos usando el estándar de Colombia/español
                input.value = Number(valorLimpio).toLocaleString('es-CO');
            } else {
                input.value = '';
            }
        }

        // Asegurarse de limpiar el valor antes de enviar por seguridad
        function prepararEnvio() {
            const visual = document.getElementById('cantidad_visual').value;
            document.getElementById('cantidad').value = visual.replace(/\./g, '');
        }

        // Autocompletar con la fecha y hora actual al abrir la página
        window.onload = function() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const formatoLocal = now.toISOString().slice(0, 16);
            
            const horaSalidaInput = document.getElementById('hora_salida');
            if (horaSalidaInput && !horaSalidaInput.value) {
                horaSalidaInput.value = formatoLocal;
            }
        };
    </script>

</body>
</html>
